<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Landmarks test</title>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@600&family=Space+Grotesk:wght@700&display=swap" rel="stylesheet" />
  <style>
    html, body { margin: 0; height: 100%; background: #070a18; overflow: hidden; color: #f4f6ff; font: 12px/1.4 "JetBrains Mono", monospace; }
    canvas { display: block; width: 100%; height: 100%; }
    #ui { position: fixed; top: 8px; left: 8px; right: 8px; z-index: 2; display: flex; flex-wrap: wrap; gap: 4px 10px; }
    #ui a { color: #19e3b1; text-decoration: none; }
    #ui a.on { color: #ffc94d; }
    #stats { position: fixed; bottom: 8px; left: 8px; z-index: 2; opacity: 0.8; white-space: pre; }
  </style>
</head>
<body>
  <canvas id="c"></canvas>
  <div id="ui"></div>
  <div id="stats"></div>
  <script type="module" src="./landmarks.js"></script>
</body>
</html>
